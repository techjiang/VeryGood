# ============================================================
# VeryGood - 站点配置文件
# 所有带 '#' 的行都是注释，按需修改即可。
# 完整字段说明见 README.md 的「配置速查表」与 docs/使用文档.md、docs/开发文档.md。
# ============================================================

site:
  title: VeryGood
  subtitle: 粉色 · 极简 · 属于 GitHub Pages 的博客
  description: VeryGood 是一个粉色系、轻量、SEO 友好、可玩性极高的开源博客主题，构建于 GitHub Pages 与 GitHub Actions 之上。
  keywords:
    - 博客
    - 主题
    - GitHub Pages
    - 开源
  url: https://techjiang.github.io  # 必填：站点域名根（不带末尾斜杠，子路径由下方 basePath 提供）
  basePath: "VeryGood"                # 子路径部署：填仓库名（部署在 /VeryGood/ 下）；根域名（xxx.github.io）留空
  language: zh-CN
  timezone: Asia/Shanghai
  nav:                                    # 追加自定义导航项（左侧栏顶部的站点导航）
    - label: 友链
      url: /links/
  sidebar_recent: 0                       # 向下兼容字段：左栏「最近更新」条数（v1.3.0 默认 0：左栏该模块关闭，见 site.sidebar.recent_count）
  footer_text: 用 VeryGood 构建 - 保持热爱，记录生活

  # ---------- 底部栏自定义（v1.1.8） ----------
  # 底部站点简介 + 导航菜单均可自由修改/增删；版权行与 "Powered by TechSauce & VeryGood" 为品牌署名，锁定不可改动。
  footer:
    about: "VeryGood\n粉色 · 极简 · 属于 GitHub Pages 的博客"   # 底部站点简介（多行用 \n 分隔）
    nav:                                   # 底部导航菜单（不写则用默认菜单：首页/归档/标签/动态/GitHub/RSS）
      # - label: 首页                      # 菜单名（自由自定义）
      #   url: /                           # 站内路径填相对路径（自动拼子路径），外链填 http(s)://
      #   if: ""                           # 可选条件：board=仅启用动态页时显示；github=仅填了 GitHub 地址时显示
      #   external: false                  # true 时按外链处理（新窗口打开）

# ---------- 公告弹窗（v1.1.6，进入页面后自动弹出） ----------
  # 居中弹窗样式，可带标题 / 链接按钮，访客关闭后本浏览器不再弹出。
  # 注意：link 填站内相对路径（如 /board/）会自动补子路径前缀；填外链（http…）则原样跳转。
  announcement:
    enabled: true                         # true 时显示公告弹窗
    title: "欢迎来到 VeryGood"              # 弹窗标题（留空则只显示文案）
    text: "🎉 VeryGood v1.5.0：中文标题自动转拼音 URL · 文章置顶 · 左栏社交链接条 · 分页可自定义 · 署名三层防线 · 插件系统完善"  # 公告文案（支持少量 HTML）
    link: "/board/"                       # 跳转地址，留空则不显示按钮
    btn_text: "去看看动态"                  # 按钮文案，留空默认「了解更多」
    type: info                            # 样式：info / tip / warn

  # ---------- 文章页底部信息（v1.1.7） ----------
  # 「更新于」时间 + 版权行 + 分享栏（微博 / X / LinkedIn / 复制链接），均可开关。
  post_extra:
    show_updated: true
    show_copyright: true
    show_share: true
    license: ""                           # 版权协议文案，如 "CC BY-NC-SA 4.0"；留空不显示

# ---------- 右侧栏（v1.1） ----------
  # ≥1760px 超宽屏显示文章目录 / 近期文章 / 标签云 / 分类 / 友链缩略 / 时钟 / 微语（330px 宽）。
  # 1760px 以下正文始终 1360px 满宽、不被右栏挤压（v1.1.8）。
  # v1.3.0：左栏「最近更新」已默认关闭（与右栏「近期文章」重复），近期文章以右栏为准。
  # v1.4.0：新增时间卡片（秒级刷新）与微语卡片（打字机轮播），由内置插件 whisper 提供，均可关闭。
  rightbar:
    enabled: true
    show_toc: true                        # 文章页目录（宽屏固定在右栏，不再挤压正文）
    show_recent: true                     # 近期文章（侧栏「近期文章」的唯一出口）
    recent_count: 5                       # 近期文章条数（v1.3.0 起与左栏解耦，独立默认 5）
    show_tags: true                       # 标签云
    tags_max: 24                          # 标签云最多展示数量
    show_categories: true                 # 分类列表
    show_links: true                      # 友链缩略（读取下方 links 配置）
    links_max: 8
    show_clock: true                      # v1.4.0：右栏时间卡片（本地时间，秒级刷新）
    show_micro: true                      # v1.4.0：右栏微语卡片（打字机效果逐条轮播）
    micro_notes:                          # v1.4.0：微语内容（最多建议 12 条，写 [] 则用插件内置默认文案）
      - "用 Issue 写文章，GitHub Actions 自动构建发布，非常省心。"
      - "莫兰迪粉：温柔克制，但也很有态度。"
      - "代码块右上角有语言标签和复制按钮，试试看。"
      - "右栏的时钟是本地时间，和微语一样都是小玩具，可玩性拉满。"

  # ---------- 左侧栏（v1.1） ----------
  # 左侧栏由「站点信息 + 站点数据 + 导航 + 自定义模块」组成（v1.3.0 起）。
  sidebar:
    recent_count: 0                       # 左栏「最近更新」条数（v1.3.0 默认 0 = 关闭；改为数字即可重新开启）
    site_data: true                       # v1.3.0：站点数据组件（文章/字数/浏览/访客 四项真实指标，v1.4.4 起移除加载耗时/地区），内置插件 site-stats 提供
    collapse: false                       # true 时侧栏模块默认折叠，访客可点击展开
    custom:                               # 追加自定义模块（放在最近更新下方）
      # - title: 我的项目
      #   icon: "✨"
      #   html: "<p>这里可以写任意 HTML，比如项目列表、小程序码、留言按钮等。</p>"

author:
  name: 你的名字
  email: you@example.com
  avatar: ""                              # 头像 URL，留空则不显示（侧栏显示为圆形头像）
  bio: 一个喜欢记录生活与思考的人
  motto: "保持热爱，奔赴山海"               # v1.5.0：座右铭/个性签名，显示在站点数据下方（左栏）
  social:
    github: techjiang
    twitter: ""
    weibo: ""
    rss: ""                               # 留空自动指向 /rss.xml

# ---------- 分类 / 标签元数据（v1.1） ----------
# 为分类 / 标签添加描述与置顶，会在标签云页 / 归档页展示。
# 格式：taxonomies.categories.<分类名>  或  taxonomies.tags.<标签名>
taxonomies:
  categories:
    # 技术:
    #   desc: 技术相关的文章
    #   pin: true                          # 置顶，排在分类列表前部
    # 生活:
    #   desc: 记录生活的碎片
  tags:
    # verygood:
    #   desc: 关于 VeryGood 主题的更新日志
    #   pin: true

# ---------- 朋友圈动态页（v1.1.2） ----------
# 独立页面 /board/：站长/站点管理者的动态时间线（朋友圈式），内容由 GitHub Issue 推送：
#   1. 在仓库新建 Issue，写下动态正文（Markdown，支持图片）；
#   2. 给 Issue 打上「Moment」标签（见下方 issues.moment_label）；
#   3. Actions 自动同步为 source/moments/*.md 并部署，页面即时更新；
#   4. 关闭该 Issue = 下线这条动态。
board:
  enabled: true                           # 生成 /board/ 页面
  title: 朋友圈动态
  desc: 站长的碎碎念与站点动态 —— 用 Issue 打上 Moment 标签即可发布，关闭 Issue 即下线。
  per_page: 30                            # 时间线最多展示条数
  repo: ""                                # 形如 "owner/repo"：动态卡片跳转到对应 GitHub Issue，留空则不显示
  giscus: false                          # 是否同步挂 giscus 评论区（需先配置下方 comments.giscus）

seo:
  image: /assets/og-default.png           # 默认社交分享图（1200x630 最佳）
  twitter_handle: ""                       # 形如 @handle
  google_site_verification: ""            # Google Search Console 验证码
  baidu_site_verification: ""            # 百度站长平台验证码
  baidu_push: false                        # 百度收录自动推送
  sitemap: true                            # 生成 sitemap.xml（含首页/文章/页面/标签/分类/归档/留言板 + 图片 sitemap）
  rss: true                                # 生成 rss.xml
  robots: true                             # 生成 robots.txt + humans.txt
  noindex_page_2plus: true                 # 分页第 2+ 页对搜索引擎 noindex

theme:
  name: verygood                           # 想自定义主题？复制 themes/verygood 为 themes/你的名字 并改这里

issues:
  publish_label: Article                   # 带此标签的 Issue 会被发布为文章（Gmeek 式写作）
  draft_label: Draft                       # 带此标签的 Issue 作为草稿，仅本地预览可见
  page_label: Page                         # 带此标签的 Issue 生成独立页面（/issue-{编号}/，正文顶部可写 front matter 自定义 slug）
  moment_label: Moment                     # 带此标签的 Issue 生成朋友圈动态（/board/ 时间线）
  slug_prefix: issue                       # 生成 source/posts|pages|moments/issue-{编号}.md
  welcome_issue: true                      # v1.4.4：仓库一个 Issue 都没有时，首次构建自动创建一条「引导 Issue」（说明用 Issue 写文章的玩法）；false 则关闭

posts:
  per_page: 10                             # 首页每页文章数（v1.5.0 默认改为 10）
  excerpt_length: 150                      # 摘要字数
  toc: true                                # 文章目录
  toc_depth: 2-3                           # 目录层级
  related: 3                               # 相关推荐条数
  date_format: "%Y-%m-%d"
  cover_default: ""                       # 无封面时的默认封面图

comments:                                  # 文章页评论：none / giscus / utterances
  provider: none                          # ← 改成 giscus 或 utterances 即开启评论
  # 开启 giscus 的步骤：① 打开 https://giscus.app → 填你的仓库（需开启 Discussions）
  # ② 按页面引导复制 repo / repo_id / category / category_id 四项填到下面即可。
  # 开启 utterances 的步骤：只需填 repo（如 user/comment-repo），最简单。
  giscus:
    repo: ""                              # 如 user/comment-repo（需开启 GitHub Discussions）
    repo_id: ""                           # 从 giscus.app 获取
    category: ""                          # 从 giscus.app 获取
    category_id: ""                       # 从 giscus.app 获取
    mapping: pathname
    lang: zh-CN
    light_theme: light
    dark_theme: dark
  utterances:
    repo: ""

links:                                      # 友链（/links/ 页 + 右栏缩略使用）
  - name: GitHub
    url: https://github.com
    desc: 全球最大的代码托管平台
    avatar: "https://github.com/github.png"    # v1.1：头像图 URL，留空则显示首字母彩球
  # - name: 你的博客
  #   url: https://example.com
  #   desc: 一句话介绍
  #   avatar: https://example.com/avatar.png

plugins: []                                  # 用户插件目录（相对仓库根），如 plugins/my-plugin
plugins_disabled: []                          # v1.3.0：禁用插件（内置名/插件目录名），如 ["footer-note"]

build:
  source_dir: source
  output_dir: dist                           # 构建输出目录（已加入 .gitignore）
  minify: true                               # 压缩 CSS
  include_drafts: false                      # true 时本地构建会包含草稿