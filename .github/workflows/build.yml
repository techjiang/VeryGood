# ============================================================
# VeryGood · GitHub Pages 部署工作流
# 核心玩法（Gmeek 式）：用 Issue 写文章
#   - 给 Issue 打上 "Article" 标签（可配置 issues.publish_label）→ 自动发布
#   - 关闭 Issue → 自动下线文章
#   - 打上 "Draft" 标签 → 作为草稿，不在线上站点出现
# 工作流：Issue 事件 → 同步为 Markdown → 构建静态站 → 部署 Pages
# ============================================================
name: Deploy VeryGood Blog

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, deleted]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write         # sync_issues.py 需要：自动创建 Article/Draft/Page/Moment 标签 + 首次部署引导 Issue
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync issues to markdown (Issue → 文章)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VG_PUBLISH_LABEL: ${{ secrets.VG_PUBLISH_LABEL }}
        run: python scripts/sync_issues.py

      - name: Build site
  env:
    PYTHONPATH: .
  run: python -m verygood build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
